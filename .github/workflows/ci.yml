name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.name }} / C++${{ matrix.std }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        std: [17, 20, 23]
        build_type: [Release]
        include:
          # Human-readable names for the matrix legend
          - os: ubuntu-latest
            name: Linux GCC
          - os: windows-latest
            name: Windows MSVC
          - os: macos-latest
            name: macOS Clang
          # One Debug job so the generator's assert() preconditions compile & run
          - os: ubuntu-latest
            name: Linux GCC
            std: 17
            build_type: Debug

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DAMKA_TEST_CXX_STANDARD=${{ matrix.std }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure
